name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  quality-gate:
    name: LLM quality gate
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The gate runs fully offline (mock LLM + local embeddings + in-memory
      # store), so it needs no secrets. To evaluate a REAL model instead, set
      # repo secrets and export them here, e.g.:
      #   LLM_PROVIDER=openai
      #   LLM_BASE_URL=https://api.groq.com/openai/v1
      #   LLM_API_KEY=${{ secrets.LLM_API_KEY }}
      - name: Run eval suite and enforce gate
        run: npx tsx src/cli.ts gate --suite examples/suite.ts --report eval-report.json
        # A non-zero exit code here fails the job and blocks the deploy job below.

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json

  deploy:
    name: Deploy (blocked by the gate)
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Quality gate passed — deploying."
