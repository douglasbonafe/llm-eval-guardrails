name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  quality-gate:
    name: LLM quality gate
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Offline and deterministic: replays recorded outputs and judge verdicts, so
      # it needs no secrets. A change to the cases, the assertions or the gate
      # logic that lowers quality fails here. To grade a LIVE model instead, drop
      # --responses and set LLM_PROVIDER / LLM_BASE_URL / LLM_API_KEY from repo
      # secrets (see README, "Recording a real model").
      - name: Gate the dataset (reference answers vs the committed baseline)
        run: >
          npx tsx src/cli.ts gate
          --dataset datasets
          --responses datasets/responses/good.json
          --snapshot-dir baselines --baseline good
          --report eval-report.json
          --summary "$GITHUB_STEP_SUMMARY"
        # A non-zero exit code here fails the job and blocks the deploy job below.

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json

  gate-selftest:
    name: Gate self-test (must block known-bad output)
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Replays a response set with 13 hand-injected defects. This step passes
      # only if the gate FAILS and flags exactly those 13 cases, so a gate that
      # silently stops catching something turns the build red.
      - name: Gate must block the degraded set
        run: >
          npx tsx src/cli.ts gate
          --dataset datasets
          --responses datasets/responses/degraded.json
          --snapshot-dir baselines --baseline good
          --expect-fail
          --summary "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (blocked by the gate)
    runs-on: ubuntu-latest
    needs: [quality-gate, gate-selftest]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Quality gate passed — deploying."
